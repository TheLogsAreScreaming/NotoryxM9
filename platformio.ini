[platformio]
default_envs = m9_foundation

[env:m9_foundation]
platform = platformio/espressif32@6.11.0
framework = arduino
board = notoryx_m9
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
  espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
  platformio/tool-esptoolpy@1.40501.0
  platformio/tool-scons@4.41101.0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
monitor_speed = 115200
extra_scripts = pre:scripts/build_only.py

